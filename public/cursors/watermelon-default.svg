    <ellipse cx="13.2" cy="15.8" rx="1.05" ry="1.75" transform="rotate(-12 13.2 15.8)" fill="#1F1F1F"/>
    <ellipse cx="18.2" cy="14.2" rx="1.05" ry="1.65" transform="rotate(14 18.2 14.2)" fill="#1F1F1F"/>
  </g>
  <!-- Crisp dark outline -->
  <path d="M5 3L25 18.5L15.6 19.6L19.4 27.6L15.2 29.5L11.4 21.5L5 25.8V3Z" stroke="#262626" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
