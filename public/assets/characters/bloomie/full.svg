<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 160" fill="none" style="--char-primary: #4ADE80; --char-secondary: #16A34A; --char-belly: #F0FDF4; --char-inner-ear: #FDA4AF; --char-blush: #FB7185; --char-eye: #1E3A2F; --char-nose: #231F20; --char-outline: #231F20;">
<ellipse cx="64" cy="146" rx="30" ry="6.5" fill="#231F20" opacity="0.12" />
<g data-layer="tail" data-character="bloomie">
