  <path d="M 33 70 L 58 72 C 57 81, 47 84, 39 82 C 34 80, 32 75, 33 70 Z" fill="#FDE68A" stroke="var(--char-secondary, #A16207)" stroke-width="2.8" stroke-linejoin="round" />
