<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 160" fill="none" style="--char-primary: #C084FC; --char-secondary: #7E22CE; --char-belly: #F3E8FF; --char-inner-ear: #E9D5FF; --char-blush: #E879F9; --char-eye: #581C87; --char-nose: #231F20; --char-outline: #231F20;">
