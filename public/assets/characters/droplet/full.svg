  <path d="M 46 105 C 34 108, 30 117, 36 122 C 41 125, 46 119, 48 113" fill="var(--char-primary, #22D3EE)" stroke="var(--char-outline, #231F20)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
