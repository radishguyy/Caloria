<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 160" fill="none" style="--char-primary: #FBBF24; --char-secondary: #D97706; --char-belly: #FEF3C7; --char-inner-ear: #FDE68A; --char-blush: #FB923C; --char-eye: #1E3A8A; --char-nose: #231F20; --char-outline: #231F20;">
